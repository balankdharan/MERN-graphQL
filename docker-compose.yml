services:
  mongo:
    image: mongo:7
    container_name: mern-graphql-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mern-graphql-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/mern-graphql
    depends_on:
      - mongo

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: mern-graphql-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - server

volumes:
  mongo-data:
